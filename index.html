:root{--encre:#17324E;--papier:#F6F2EA;--ambre:#BE623C}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{min-height:100svh;display:flex;align-items:center;justify-content:center;padding:32px 16px;
  background:radial-gradient(60% 55% at 50% 42%,#1f4068 0%,#17324E 45%,#0c1c2d 100%);
  color:var(--papier);font-family:'Inter',-apple-system,"Helvetica Neue",Arial,sans-serif;text-align:center}
main{max-width:820px;width:100%}
h1,.lieu{text-wrap:balance}
.marque{display:block;width:min(340px,78vw);height:auto;margin:0 auto;color:var(--papier)}
.filet{width:44px;height:2px;background:var(--ambre);margin:30px auto}
h1{font-family:'Literata',Georgia,serif;font-weight:400;font-size:clamp(24px,5vw,32px);line-height:1.25}
.offres{list-style:none;padding:0;margin:26px 0 0;display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.offres li{font-size:15px;line-height:1.3;padding:8px 14px;border-radius:999px;background:rgba(246,242,234,.08);color:var(--papier)}
.lieu{margin-top:22px;font-size:15px;line-height:1.6;color:rgba(246,242,234,.72)}
.bloc{display:inline-block}
.bientot{margin-top:22px;font-size:13px;color:rgba(246,242,234,.5)}
